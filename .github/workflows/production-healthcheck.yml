name: Production healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production endpoints
        env:
          HEALTHCHECK_ATTEMPTS: 3
          HEALTHCHECK_MAX_RESPONSE_MS: 5000
          HEALTHCHECK_TIMEOUT_MS: 10000
          HEALTHCHECK_CLINIC_URL: ${{ vars.HEALTHCHECK_CLINIC_URL || 'https://podo360.supremetechdev.com/healthcheck.json' }}
          HEALTHCHECK_ADMIN_URL: ${{ vars.HEALTHCHECK_ADMIN_URL || 'https://podoadmin360.supremetechdev.com/healthcheck.json' }}
          HEALTHCHECK_CADASTRO_URL: ${{ vars.HEALTHCHECK_CADASTRO_URL || 'https://cadastro.podo360.supremetechdev.com/healthcheck.json' }}
        run: node scripts/healthcheck-production.mjs
